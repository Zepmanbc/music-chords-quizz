<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chords Quizz</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <h2 id="question"></h2>

      <p>Notes :</p>
      <div id="notes"></div>

      <br />
      <div class="container" id="btn-validate">
        <button>Valider</button>
      </div>
      <div class="container" id="btn-nextQuestion">
        <button>Question suivante</button>
      </div>

      <h3 id="result"></h3>

      <p>Score :</p>
      <p>✅ <span id="correct">0</span> | ❌ <span id="wrong">0</span></p>
    </div>
    <script type="module" src="./scripts.js"></script>
  </body>
</html>
